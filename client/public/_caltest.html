<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cal test</title>
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="stylesheet" href="/src/Layout.css" />
    <link rel="stylesheet" href="/src/pages/Planner.css" />
    <link rel="stylesheet" href="/src/components/planner/MonthGrid.css" />
    <link rel="stylesheet" href="/src/components/planner/ModeSwitch.css" />
  </head>
  <body>
    <div class="theme-light" data-style="pastel" data-palette="ocean">
      <div class="app-content">
        <div class="planner">
          <section class="planner-grid-panel card" id="gridpanel">
            <div class="month-grid">
              <div class="month-grid-header">
                <button class="month-grid-nav">‹</button>
                <span class="month-grid-title">Жовтень 2026 р.</span>
                <button class="month-grid-nav">›</button>
              </div>
              <div class="month-grid-weekdays" id="wd"></div>
              <div class="month-grid-cells" id="cells"></div>
            </div>
            <div class="planner-free-hours">
              <label>Мінімум вільних годин <input type="number" value="2" /></label>
            </div>
          </section>
          <section class="planner-work-panel">
            <div class="card planner-mode-card">робоча панель</div>
            <div class="card planner-content-card">День / Період…</div>
          </section>
        </div>
      </div>
    </div>
    <script>
      document.getElementById('wd').innerHTML = 'ПН,ВТ,СР,ЧТ,ПТ,СБ,НД'.split(',').map(d => `<span>${d}</span>`).join('')
      let html = ''
      for (let i = 28; i <= 30; i++) html += `<button class="month-grid-cell month-grid-cell--outside">${i}</button>`
      for (let i = 1; i <= 31; i++) {
        let mod = ''
        if (i === 27) mod = 'month-grid-cell--today'
        if (i === 28) mod = 'month-grid-cell--selected'
        if (i === 8 || i === 15) mod = 'month-grid-cell--busy'
        html += `<button class="month-grid-cell ${mod}">${i}</button>`
      }
      for (let i = 1; i <= 8; i++) html += `<button class="month-grid-cell month-grid-cell--outside">${i}</button>`
      document.getElementById('cells').innerHTML = html
      const p = document.getElementById('gridpanel').getBoundingClientRect()
      const g = document.querySelector('.month-grid-cells').getBoundingClientRect()
      const dbg = document.createElement('div')
      dbg.style.cssText = 'position:fixed;bottom:0;left:0;background:#000;color:#0f0;font:12px monospace;padding:6px;z-index:99'
      dbg.textContent = `panel: ${Math.round(p.left)}-${Math.round(p.right)} (w${Math.round(p.width)})  cells: ${Math.round(g.left)}-${Math.round(g.right)} (w${Math.round(g.width)})`
      document.body.appendChild(dbg)
    </script>
  </body>
</html>
